[project]
name = "unichat"
version = "0.1.0"
description = ""
authors = [{ name = "Ivan", email = "iivan.zybin@gmail.com" }]
requires-python = "~=3.12"

dependencies = [
    "fastapi>=0.115.12,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "sqlalchemy>=2.0.40,<3",
    "asyncpg>=0.30.0,<0.31",
    "python-socketio[asyncio-client]>=5.12.1,<6",
    "redis>=5.2.1,<6",
    "alembic>=1.15.2,<2",
    "pydantic-settings>=2.9.1,<3",
    "fastapi-mail>=1.4.2,<2",
    "passlib>=1.7.4,<2",
    "pyjwt>=2.10.1,<3",
    "python-multipart>=0.0.20,<0.0.21",
    "dishka>=1.5.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/"]